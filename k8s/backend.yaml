apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ai-backend
  namespace: devops-ai
spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-ai-backend

  template:
    metadata:
      labels:
        app: devops-ai-backend

    spec:

      containers:
        - name: backend

          image: devops-ai-backend:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: KUBERNETES_NAMESPACE
              value: "default"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"